name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Keep the focused Redis-compatible-server check on its weekly cadence in addition to pull requests
  # and pushes to main. The other CI jobs skip this scheduled invocation.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# CI only builds, tests, and uploads artifacts — the default token never needs write access.
permissions:
  contents: read

# One CI run per ref: a superseded push to a pull request cancels its in-flight run; pushes to
# main and the weekly schedule queue behind the current run instead of cancelling it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # The weekly schedule exists only for the redis-compat matrix; skip the per-push jobs on it.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # MTP otherwise executes both target frameworks concurrently. On the 2-core hosted runner that
      # has repeatedly starved real-time durable-flow tests; keep the same coverage, one TFM at a time.
      - name: Test (unit, net8.0)
        run: |
          dotnet test --project tests/AsyncResponse.Tests/AsyncResponse.Tests.csproj \
            --configuration Release --framework net8.0 --no-build \
            --report-trx \
            --coverage \
            --coverage-output-format cobertura \
            --coverage-output unit-net8.0.cobertura.xml \
            --results-directory "${{ github.workspace }}/TestResults"

      - name: Test (unit, net10.0)
        run: |
          dotnet test --project tests/AsyncResponse.Tests/AsyncResponse.Tests.csproj \
            --configuration Release --framework net10.0 --no-build \
            --report-trx \
            --coverage \
            --coverage-output-format cobertura \
            --coverage-output unit-net10.0.cobertura.xml \
            --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          overwrite: true
          path: ${{ github.workspace }}/TestResults

      # Coverage alone, for the `coverage` job to merge with the integration suite's. The glob is
      # non-recursive on purpose: --report-trx also copies each file into its attachment folder,
      # and a recursive pattern would ship — and then double-count — both copies.
      - name: Upload unit coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          overwrite: true
          path: ${{ github.workspace }}/TestResults/*.cobertura.xml
          if-no-files-found: error

      - name: Pack (validation only)
        # Solution-level pack: every non-src project sets IsPackable=false, so this packs exactly
        # the shipped src/** packages without a hand-maintained list.
        run: dotnet pack AsyncResponse.slnx --configuration Release --no-build -o ./artifacts

      - name: Upload packages as build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          overwrite: true
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

  unit-tests-cross-platform:
    # The library targets every OS .NET runs on; the unit suite (no Docker dependencies) proves it
    # beyond Linux. The Docker-backed integration suite stays on ubuntu.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # One TFM at a time: MTP runs multi-targeted test assemblies in parallel by default,
      # which oversubscribes the 2-core runners and starves the suite's real-time tests
      # (leases, watchdog scans, dispatch windows) — the source of rotating per-run flakes.
      - name: Test (unit, net8.0)
        run: >
          dotnet test --project tests/AsyncResponse.Tests/AsyncResponse.Tests.csproj
          --configuration Release --framework net8.0

      - name: Test (unit, net10.0)
        run: >
          dotnet test --project tests/AsyncResponse.Tests/AsyncResponse.Tests.csproj
          --configuration Release --framework net10.0

  aot-smoke:
    # The end-to-end proof behind the packages' IsAotCompatible=true claim: publish the smoke
    # sample as Native AOT (full trimming, no reflection-based System.Text.Json) and run the
    # native binary. It exercises the envelope round-trip, a durable flow (checkpoints, awaited
    # step, values bag), worker-job dispatch, and the AsyncResponseJsonSerialization seam.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish (Native AOT)
        run: dotnet publish samples/AsyncResponse.AotSmoke/AsyncResponse.AotSmoke.csproj --configuration Release -o ./artifacts/aot-smoke

      - name: Run native binary
        run: ./artifacts/aot-smoke/AsyncResponse.AotSmoke

  integration-tests-aot:
    # The same integration suite, but the 20 SUT resources run the Native AOT-published sample
    # binary instead of the JIT project (ASYNCRESPONSE_ITEST_SUT=aot). MongoDB-configured SUTs
    # stay JIT (MongoDB.Driver is not trim/AOT-compatible; vendor matrix in docs/aot.md). This is
    # what actually proves every channel/transport package works when compiled into a trimmed
    # native app against the real broker fleet.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify Docker
        run: docker version

      - name: Publish SUT (Native AOT)
        run: dotnet publish samples/AsyncResponse.Sample/AsyncResponse.Sample.csproj --configuration Release -o ./artifacts/sut-aot

      - name: Reclaim hosted runner disk
        # The full broker fleet exhausted the stock runner while Docker was extracting images. These
        # SDKs are unrelated to this .NET job; remove them only from the disposable hosted runner.
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/swift \
            /usr/local/.ghcup
          df -h /

      - name: Restore
        run: dotnet restore tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj

      - name: Build
        run: dotnet build tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj --configuration Release --no-restore

      - name: Test (integration, AOT SUT)
        env:
          ASYNCRESPONSE_ITEST_SUT: aot
          ASYNCRESPONSE_ITEST_SUT_PATH: ${{ github.workspace }}/artifacts/sut-aot/AsyncResponse.Sample
          # This job already publishes the sample natively and runs the whole suite against it;
          # the in-suite publish gate would only repeat that work here. The plain integration job
          # keeps the gate active, so ILC-only regressions still fail CI (and local full runs).
          ASYNCRESPONSE_SKIP_AOT_GATE: "1"
          # The regular integration job owns the Oracle and Cosmos store contracts. Avoid pulling
          # those two large images again in the job whose distinct purpose is the Native AOT SUT.
          ASYNCRESPONSE_ITEST_SKIP_ORACLE_COSMOS: "true"
        run: |
          # The suite runs in batches, each booting its own Aspire AppHost; on 2-core hosted runners a
          # boot intermittently times out or a resource fails to start before any test executes. Retry
          # once on that exact signature only — genuine test failures never produce it, so they still
          # fail the job on the first pass. The signature matches the *BatchFixture types in
          # Batches.cs; keep it in sync if a batch fixture is ever renamed.
          run_integration_tests() {
            # The cross-product shards are excluded deliberately. Everything in them builds its hosts
            # in this test process and never touches the sample app, so running them here proves
            # nothing about the Native AOT SUT while booting nine more fleets — and the Oracle/Cosmos
            # shards cannot run at all under ASYNCRESPONSE_ITEST_SKIP_ORACLE_COSMOS above. The
            # dedicated matrix-* legs own that coverage.
            #
            # Excluded by trait rather than class name on purpose: the transport contract classes live
            # in the matrix collections too but are not named Matrix*, and a name-based filter would
            # leave them behind to boot a shard fleet here.
            dotnet test --project tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj \
              --configuration Release --no-build \
              --filter-not-trait "batch=matrix-*" \
              --report-trx \
              --results-directory "${{ github.workspace }}/TestResults/IntegrationAot" \
              2>&1 | tee itest-console.log
            return "${PIPESTATUS[0]}"
          }
          if ! run_integration_tests; then
            if grep -q "BatchFixture' threw in InitializeAsync" itest-console.log; then
              echo "::warning::Integration fixture failed to boot (known hosted-runner resource flake) — retrying the suite once."
              run_integration_tests
            else
              exit 1
            fi
          fi

      - name: Upload integration test results (AOT SUT)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results-aot
          overwrite: true
          path: ${{ github.workspace }}/TestResults/IntegrationAot

  integration-tests:
    # The weekly schedule exists only for the redis-compat matrix; skip the per-push jobs on it.
    if: github.event_name != 'schedule'
    # One leg per batch. The suite already runs in batches in-process (each boots its own AppHost and
    # tears it down before the next), so a leg is just "run one of them" — selected by the trait every
    # test class carries, which BatchAssignmentTests keeps honest. Three things this buys over running
    # all batches on one runner: the legs run concurrently instead of end to end; each runner pulls
    # only its own batch's images, which is what the disk reclaim below is fighting; and a broker
    # failure no longer hides a database one.
    #
    # The legs partition the suite exactly — every test carries a batch trait, "none" included, so
    # nothing silently stops running. Keep this list in sync with Batches.cs.
    #
    # The nine matrix-* legs are the provider cross product: every channel against every transport
    # against every durable-flow store, 660 combinations, three scenarios each. They are shards rather
    # than one leg because the whole fleet at once is roughly 9 GiB of containers — and because Oracle
    # and Cosmos, the two largest images, cannot share a runner. Each shard boots only the containers
    # its own cells touch; MatrixCompletenessTests asserts the shards partition the product.
    strategy:
      # A failing leg must not cancel the others, or the first failure hides the rest of the signal.
      fail-fast: false
      matrix:
        batch:
          - data
          - oracle-cosmos
          - brokers
          - cloud
          - none
          - matrix-database-light
          - matrix-broker-light
          - matrix-cloud-light
          - matrix-database-oracle
          - matrix-broker-oracle
          - matrix-cloud-oracle
          - matrix-database-cosmos
          - matrix-broker-cosmos
          - matrix-cloud-cosmos
    name: integration-tests (${{ matrix.batch }})
    runs-on: ubuntu-latest
    # The cross-product shards run hundreds of cells each and boot a larger fleet than the original
    # batches: database-light alone is 288 cells (~7 minutes of cells locally, plus fleet startup).
    timeout-minutes: ${{ startsWith(matrix.batch, 'matrix-') && 90 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Reclaim hosted runner disk
        # The real CI failures were ENOSPC while Docker extracted the broker/database fleet, not test
        # timeouts. Keep the required .NET toolchain and remove unrelated preinstalled SDKs. A leg only
        # pulls its own batch's images now, which is most of why the matrix helps here.
        if: matrix.batch != 'none'
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/swift \
            /usr/local/.ghcup
          df -h /

      - name: Verify Docker
        if: matrix.batch != 'none'
        run: docker version

      - name: Restore
        run: dotnet restore tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj

      - name: Build
        run: dotnet build tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj --configuration Release --no-restore

      - name: Test (integration, ${{ matrix.batch }})
        # This leg boots only its own batch's containers and sample apps; the inventory per batch is
        # in docs/operations.md. "none" boots nothing at all — it is the in-memory suite, the Native
        # AOT publish gate, and the batch guards.
        run: |
          # Same targeted boot-flake retry as the AOT integration job: rerun once only when the
          # failure signature is a batch fixture failing to initialize, never for test failures.
          run_integration_tests() {
            dotnet test --project tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj \
              --configuration Release --no-build \
              --filter-trait "batch=${{ matrix.batch }}" \
              --report-trx \
              --coverage \
              --coverage-output-format cobertura \
              --coverage-output integration.${{ matrix.batch }}.cobertura.xml \
              --results-directory "${{ github.workspace }}/TestResults/Integration" \
              2>&1 | tee itest-console.log
            return "${PIPESTATUS[0]}"
          }
          if ! run_integration_tests; then
            # Matches both the original *BatchFixture types and the cross-product shards' fixtures
            # (MatrixDatabaseLightFixture and friends), which carry no "Batch" infix.
            if grep -q "Fixture' threw in InitializeAsync" itest-console.log; then
              echo "::warning::Batch '${{ matrix.batch }}' failed to boot (known hosted-runner resource flake) — retrying once."
              run_integration_tests
            else
              exit 1
            fi
          fi

      - name: Upload integration test results (${{ matrix.batch }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results-${{ matrix.batch }}
          overwrite: true
          path: ${{ github.workspace }}/TestResults/Integration

      # The container-backed suite is most of the coverage: the database and broker paths it drives
      # are unreachable from the unit suite, which alone reads ~16 points lower. Each leg uploads its
      # own slice; the coverage job globs coverage-* and merges them, so the published number still
      # reflects the whole suite.
      - name: Upload integration coverage (${{ matrix.batch }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration-${{ matrix.batch }}
          overwrite: true
          path: ${{ github.workspace }}/TestResults/Integration/*.cobertura.xml
          if-no-files-found: error

  redis-compat:
    # Validates that the Redis channel + transport (RESP via StackExchange.Redis) run unchanged on
    # Redis-compatible servers. The profile boots only Valkey and the two Redis SUT variants, then
    # runs the Redis channel + Streams transport tests. That keeps unrelated databases and brokers
    # from turning this compatibility signal red.
    #
    # Only true drop-ins go here — servers whose image shares the redis `docker-entrypoint.sh` +
    # `*-server` launch contract that the Aspire Redis integration drives. Valkey qualifies. Dragonfly
    # and Garnet do NOT and are validated separately (see docs/configuration.md#redis-compatible-servers):
    # Dragonfly's RESP is compatible but its container entrypoint differs, so it is validated by direct
    # connection; Garnet has no stream commands, so it is a channel-only server.
    # This focused matrix runs on each normal CI invocation and retains the weekly scheduled check.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: valkey
            image: valkey/valkey
            tag: '8'
            registry: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify Docker
        run: docker version

      - name: Restore
        run: dotnet restore tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj

      - name: Build
        run: dotnet build tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj --configuration Release --no-restore

      - name: Test (integration on ${{ matrix.server }})
        # The AppHost reads these to start its Redis-only profile on the compatible server image.
        env:
          ASYNCRESPONSE_ITEST_PROFILE: redis-compat
          ASYNCRESPONSE_ITEST_REDIS_IMAGE: ${{ matrix.image }}
          ASYNCRESPONSE_ITEST_REDIS_TAG: ${{ matrix.tag }}
          ASYNCRESPONSE_ITEST_REDIS_REGISTRY: ${{ matrix.registry }}
        run: |
          dotnet test --project tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj \
            --configuration Release --no-build \
            --filter-class \
              AsyncResponse.IntegrationTests.RedisChannelTests \
              AsyncResponse.IntegrationTests.RedisTransportTests \
            --report-trx \
            --results-directory "${{ github.workspace }}/TestResults/Integration-${{ matrix.server }}"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results-${{ matrix.server }}
          overwrite: true
          path: ${{ github.workspace }}/TestResults/Integration-${{ matrix.server }}

  coverage:
    # Merges the unit and integration cobertura reports into the published coverage report and the
    # two README badges. Depends on both suites, so a red build never republishes a number.
    if: github.event_name != 'schedule'
    needs: [build-and-test, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job writes; the workflow default stays contents: read.
    permissions:
      contents: write
    # Shared with the benchmark and load-test workflows: all three commit to gh-pages, and
    # concurrent pushes to the same branch fail on a non-fast-forward.
    concurrency:
      group: benchmark-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage-input

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.10

      - name: Render report
        # Filters, report types and badge thresholds live in the script, shared with the local
        # scripts/coverage.sh, so a contributor's report and this badge measure the same thing.
        # COVERAGE_LABEL records what was built: totals are not comparable across configurations
        # (Release instruments thousands fewer lines than Debug), and the published report is the
        # one people compare against, so it has to state its own shape.
        env:
          COVERAGE_LABEL: Release / net8.0+net10.0 / unit+integration
        run: ./scripts/coverage-report.sh "coverage-input/*.cobertura.xml" coverage-report

      - name: Job summary
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          overwrite: true
          path: coverage-report

      # Pull requests (including forks, which have no write token) stop at the artifact and the job
      # summary above. Only main republishes what the README badges read.
      - name: Publish to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # Each attempt rebuilds the commit on the current remote tip instead of rebasing a local
          # one: actions/checkout clones shallow, where `pull --rebase` is unreliable, and a
          # rebuilt commit is correct regardless of what landed in between. The concurrency group
          # makes a collision with the benchmark workflows unlikely; the retry covers a manual push.
          publish() {
            git fetch origin gh-pages
            git worktree remove --force ../gh-pages 2>/dev/null || true
            git worktree add --detach ../gh-pages origin/gh-pages
            # Replace the coverage tree wholesale so pages for deleted classes do not linger, and
            # touch nothing else — dev/bench on this branch belongs to the benchmark workflow.
            rm -rf ../gh-pages/coverage
            cp -r coverage-report ../gh-pages/coverage
            git -C ../gh-pages add coverage
            if git -C ../gh-pages diff --staged --quiet; then
              echo "Coverage unchanged; nothing to publish."
              return 0
            fi
            git -C ../gh-pages commit -m "coverage: ${GITHUB_SHA::7}"
            git -C ../gh-pages push origin HEAD:gh-pages
          }
          for attempt in 1 2 3; do
            if publish; then exit 0; fi
            echo "::warning::gh-pages publish attempt ${attempt} failed; retrying."
            sleep $((attempt * 5))
          done
          exit 1
