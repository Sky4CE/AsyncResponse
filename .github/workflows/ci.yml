name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Keep the focused Redis-compatible-server check on its weekly cadence in addition to pull requests
  # and pushes to main. The other CI jobs skip this scheduled invocation.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# CI only builds, tests, and uploads artifacts — the default token never needs write access.
permissions:
  contents: read

jobs:
  build-and-test:
    # The weekly schedule exists only for the redis-compat matrix; skip the per-push jobs on it.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # MTP otherwise executes both target frameworks concurrently. On the 2-core hosted runner that
      # has repeatedly starved real-time durable-flow tests; keep the same coverage, one TFM at a time.
      - name: Test (unit, net8.0)
        run: |
          dotnet test --project tests/AsyncResponse.Tests/AsyncResponse.Tests.csproj \
            --configuration Release --framework net8.0 --no-build \
            --report-trx \
            --coverage \
            --results-directory "${{ github.workspace }}/TestResults"

      - name: Test (unit, net10.0)
        run: |
          dotnet test --project tests/AsyncResponse.Tests/AsyncResponse.Tests.csproj \
            --configuration Release --framework net10.0 --no-build \
            --report-trx \
            --coverage \
            --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: ${{ github.workspace }}/TestResults

      - name: Pack (validation only)
        run: |
          dotnet pack src/AsyncResponse.Abstractions/AsyncResponse.Abstractions.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/AsyncResponse.Core/AsyncResponse.Core.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/Channels/AsyncResponse.Channels.MongoDB/AsyncResponse.Channels.MongoDB.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/Channels/AsyncResponse.Channels.NATS/AsyncResponse.Channels.NATS.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/Channels/AsyncResponse.Channels.PostgreSQL/AsyncResponse.Channels.PostgreSQL.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/Channels/AsyncResponse.Channels.Redis/AsyncResponse.Channels.Redis.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/Channels/AsyncResponse.Channels.SqlServer/AsyncResponse.Channels.SqlServer.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.AzureServiceBus/AsyncResponse.Transports.AzureServiceBus.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.Kafka/AsyncResponse.Transports.Kafka.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.MongoDB/AsyncResponse.Transports.MongoDB.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.NATS/AsyncResponse.Transports.NATS.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.PostgreSQL/AsyncResponse.Transports.PostgreSQL.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.RabbitMQ/AsyncResponse.Transports.RabbitMQ.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.Redis/AsyncResponse.Transports.Redis.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.SqlServer/AsyncResponse.Transports.SqlServer.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.GooglePubSub/AsyncResponse.Transports.GooglePubSub.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.SQS/AsyncResponse.Transports.SQS.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.SqlServer/AsyncResponse.DurableFlows.SqlServer.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.PostgreSQL/AsyncResponse.DurableFlows.PostgreSQL.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.MySql/AsyncResponse.DurableFlows.MySql.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.Sqlite/AsyncResponse.DurableFlows.Sqlite.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.Oracle/AsyncResponse.DurableFlows.Oracle.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.MongoDB/AsyncResponse.DurableFlows.MongoDB.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.Cosmos/AsyncResponse.DurableFlows.Cosmos.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.DynamoDB/AsyncResponse.DurableFlows.DynamoDB.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.EFCore/AsyncResponse.DurableFlows.EFCore.csproj --configuration Release --no-build -o ./artifacts

      - name: Upload packages as build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  unit-tests-cross-platform:
    # The library targets every OS .NET runs on; the unit suite (no Docker dependencies) proves it
    # beyond Linux. The Docker-backed integration suite stays on ubuntu.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # One TFM at a time: MTP runs multi-targeted test assemblies in parallel by default,
      # which oversubscribes the 2-core runners and starves the suite's real-time tests
      # (leases, watchdog scans, dispatch windows) — the source of rotating per-run flakes.
      - name: Test (unit, net8.0)
        run: >
          dotnet test --project tests/AsyncResponse.Tests/AsyncResponse.Tests.csproj
          --configuration Release --framework net8.0

      - name: Test (unit, net10.0)
        run: >
          dotnet test --project tests/AsyncResponse.Tests/AsyncResponse.Tests.csproj
          --configuration Release --framework net10.0

  aot-smoke:
    # The end-to-end proof behind the packages' IsAotCompatible=true claim: publish the smoke
    # sample as Native AOT (full trimming, no reflection-based System.Text.Json) and run the
    # native binary. It exercises the envelope round-trip, a durable flow (checkpoints, awaited
    # step, values bag), worker-job dispatch, and the AsyncResponseJsonSerialization seam.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish (Native AOT)
        run: dotnet publish samples/AsyncResponse.AotSmoke/AsyncResponse.AotSmoke.csproj --configuration Release -o ./artifacts/aot-smoke

      - name: Run native binary
        run: ./artifacts/aot-smoke/AsyncResponse.AotSmoke

  integration-tests-aot:
    # The same integration suite, but the 20 SUT resources run the Native AOT-published sample
    # binary instead of the JIT project (ASYNCRESPONSE_ITEST_SUT=aot). MongoDB-configured SUTs
    # stay JIT (MongoDB.Driver is not trim/AOT-compatible; vendor matrix in docs/aot.md). This is
    # what actually proves every channel/transport package works when compiled into a trimmed
    # native app against the real broker fleet.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify Docker
        run: docker version

      - name: Publish SUT (Native AOT)
        run: dotnet publish samples/AsyncResponse.Sample/AsyncResponse.Sample.csproj --configuration Release -o ./artifacts/sut-aot

      - name: Reclaim hosted runner disk
        # The full broker fleet exhausted the stock runner while Docker was extracting images. These
        # SDKs are unrelated to this .NET job; remove them only from the disposable hosted runner.
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/swift \
            /usr/local/.ghcup
          df -h /

      - name: Restore
        run: dotnet restore tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj

      - name: Build
        run: dotnet build tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj --configuration Release --no-restore

      - name: Test (integration, AOT SUT)
        env:
          ASYNCRESPONSE_ITEST_SUT: aot
          ASYNCRESPONSE_ITEST_SUT_PATH: ${{ github.workspace }}/artifacts/sut-aot/AsyncResponse.Sample
          # This job already publishes the sample natively and runs the whole suite against it;
          # the in-suite publish gate would only repeat that work here. The plain integration job
          # keeps the gate active, so ILC-only regressions still fail CI (and local full runs).
          ASYNCRESPONSE_SKIP_AOT_GATE: "1"
          # The regular integration job owns the Oracle and Cosmos store contracts. Avoid pulling
          # those two large images again in the job whose distinct purpose is the Native AOT SUT.
          ASYNCRESPONSE_ITEST_SKIP_ORACLE_COSMOS: "true"
        run: |
          dotnet test --project tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj \
            --configuration Release --no-build \
            --report-trx \
            --results-directory "${{ github.workspace }}/TestResults/IntegrationAot"

      - name: Upload integration test results (AOT SUT)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results-aot
          path: ${{ github.workspace }}/TestResults/IntegrationAot

  integration-tests:
    # The weekly schedule exists only for the redis-compat matrix; skip the per-push jobs on it.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Reclaim hosted runner disk
        # The real CI failures were ENOSPC while Docker extracted the broker/database fleet, not test
        # timeouts. Keep the required .NET toolchain and remove unrelated preinstalled SDKs.
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/swift \
            /usr/local/.ghcup
          df -h /

      - name: Verify Docker
        run: docker version

      - name: Restore
        run: dotnet restore tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj

      - name: Build
        run: dotnet build tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj --configuration Release --no-restore

      - name: Test (integration)
        # The integration fixture boots the Aspire AppHost, which starts Redis, the Google Pub/Sub
        # emulator, Azure Service Bus emulator, LocalStack (SQS), RabbitMQ, NATS, PostgreSQL,
        # SQL Server, Kafka, MongoDB (single-node replica set), and SUT apps.
        run: |
          dotnet test --project tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj \
            --configuration Release --no-build \
            --report-trx \
            --results-directory "${{ github.workspace }}/TestResults/Integration"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results
          path: ${{ github.workspace }}/TestResults/Integration

  redis-compat:
    # Validates that the Redis channel + transport (RESP via StackExchange.Redis) run unchanged on
    # Redis-compatible servers. The profile boots only Valkey and the two Redis SUT variants, then
    # runs the Redis channel + Streams transport tests. That keeps unrelated databases and brokers
    # from turning this compatibility signal red.
    #
    # Only true drop-ins go here — servers whose image shares the redis `docker-entrypoint.sh` +
    # `*-server` launch contract that the Aspire Redis integration drives. Valkey qualifies. Dragonfly
    # and Garnet do NOT and are validated separately (see docs/configuration.md#redis-compatible-servers):
    # Dragonfly's RESP is compatible but its container entrypoint differs, so it is validated by direct
    # connection; Garnet has no stream commands, so it is a channel-only server.
    # This focused matrix runs on each normal CI invocation and retains the weekly scheduled check.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: valkey
            image: valkey/valkey
            tag: '8'
            registry: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify Docker
        run: docker version

      - name: Restore
        run: dotnet restore tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj

      - name: Build
        run: dotnet build tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj --configuration Release --no-restore

      - name: Test (integration on ${{ matrix.server }})
        # The AppHost reads these to start its Redis-only profile on the compatible server image.
        env:
          ASYNCRESPONSE_ITEST_PROFILE: redis-compat
          ASYNCRESPONSE_ITEST_REDIS_IMAGE: ${{ matrix.image }}
          ASYNCRESPONSE_ITEST_REDIS_TAG: ${{ matrix.tag }}
          ASYNCRESPONSE_ITEST_REDIS_REGISTRY: ${{ matrix.registry }}
        run: |
          dotnet test --project tests/AsyncResponse.IntegrationTests/AsyncResponse.IntegrationTests.csproj \
            --configuration Release --no-build \
            --filter-class \
              AsyncResponse.IntegrationTests.RedisChannelTests \
              AsyncResponse.IntegrationTests.RedisTransportTests \
            --report-trx \
            --results-directory "${{ github.workspace }}/TestResults/Integration-${{ matrix.server }}"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results-${{ matrix.server }}
          path: ${{ github.workspace }}/TestResults/Integration-${{ matrix.server }}
