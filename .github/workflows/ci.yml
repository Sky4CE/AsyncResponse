name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger trx

      - name: Pack (validation only)
        run: |
          dotnet pack src/AsyncResponse.Abstractions/AsyncResponse.Abstractions.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/AsyncResponse.Core/AsyncResponse.Core.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/AsyncResponse.Redis/AsyncResponse.Redis.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/AsyncResponse.GooglePubSub/AsyncResponse.GooglePubSub.csproj --configuration Release --no-build -o ./artifacts

      - name: Upload packages as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
