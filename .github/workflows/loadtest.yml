name: Load test

# End-to-end HTTP load test (NBomber) against the real Redis + broker transport stack. Runs the broad
# non-destructive profile on every push to main and publishes throughput/latency to the same gh-pages
# dashboard as the benchmarks workflow; manual runs can select focused azure-servicebus/pubsub/
# rabbitmq/redis/nats/postgresql/sqlserver/kafka/sqs/mongodb/recovery profiles. Extra CLI args and
# AppHost env overrides keep workflow_dispatch below GitHub's 25-input limit as new transports/channels
# are added.
# It is Docker-backed, so it shares a concurrency group with the benchmarks workflow to avoid racing
# on the gh-pages history.
on:
  push:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.slnx'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - '.github/workflows/loadtest.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Scenario profile: broad, azure-servicebus, pubsub, rabbitmq, redis, nats, postgresql, sqlserver, kafka, sqs, mongodb, recovery'
        default: 'broad'
      rate:
        description: 'Requests per second, per scenario'
        default: '20'
      duration:
        description: 'Load duration in seconds'
        default: '30'
      extra_args:
        description: 'Shell-style extra AsyncResponse.LoadTests args, e.g. --redis-url http://host --scenario request_response_success_redis'
        default: ''
      apphost_env:
        description: 'Optional KEY=VALUE Aspire SUT env overrides, newline or shell-space separated'
        default: ''

# github-action-benchmark commits the results history to gh-pages.
permissions:
  contents: write

concurrency:
  group: benchmark-publish
  cancel-in-progress: false

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify Docker
        run: docker version

      # Boots Redis + a Pub/Sub emulator + Azure Service Bus emulator + LocalStack (SQS) + RabbitMQ +
      # NATS + PostgreSQL + SQL Server + Kafka + MongoDB (single-node replica set) sample SUTs via
      # Aspire, drives them with NBomber, and emits github-action-benchmark JSON. Exits non-zero
      # (failing the job) if any request failed.
      - name: Run NBomber load test
        env:
          LOADTEST_PROFILE: ${{ github.event.inputs.profile || 'broad' }}
          LOADTEST_RATE: ${{ github.event.inputs.rate || '' }}
          LOADTEST_DURATION: ${{ github.event.inputs.duration || '30' }}
          LOADTEST_EXTRA_ARGS: ${{ github.event.inputs.extra_args || '' }}
          LOADTEST_APPHOST_ENV: ${{ github.event.inputs.apphost_env || '' }}
          # No ASYNCRESPONSE_ITEST_SKIP_ORACLE_COSMOS here: the load test asks the AppHost for its own
          # "loadtest" batch, which never declares Oracle or Cosmos — nothing load-tested touches them.
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/loadtest-env"
          import os
          import re
          import shlex
          import sys

          for raw in os.environ.get("LOADTEST_APPHOST_ENV", "").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              try:
                  assignments = shlex.split(line)
              except ValueError as ex:
                  sys.exit(f"Invalid apphost_env line: {ex}")
              for assignment in assignments:
                  if "=" not in assignment:
                      sys.exit(f"Invalid apphost_env entry (expected KEY=VALUE): {assignment}")
                  key, value = assignment.split("=", 1)
                  if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key):
                      sys.exit(f"Invalid apphost_env key: {key}")
                  print(f"{key}={value}")
          PY
          while IFS= read -r assignment; do
            if [ -n "$assignment" ]; then
              export "$assignment"
            fi
          done < "$RUNNER_TEMP/loadtest-env"

          rate="${LOADTEST_RATE:-20}"
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            rate="${LOADTEST_RATE:-5}"
          fi

          args=(
            --profile "$LOADTEST_PROFILE"
            --rate "$rate"
            --duration "$LOADTEST_DURATION"
            --warmup 10
            --gh-json "${{ github.workspace }}/loadtest"
          )

          python3 - <<'PY' > "$RUNNER_TEMP/loadtest-extra-args"
          import os
          import shlex

          for arg in shlex.split(os.environ.get("LOADTEST_EXTRA_ARGS", "")):
              print(arg)
          PY
          extra_args=()
          while IFS= read -r arg; do
            if [ -n "$arg" ]; then
              extra_args+=("$arg")
            fi
          done < "$RUNNER_TEMP/loadtest-extra-args"
          if [ "${#extra_args[@]}" -gt 0 ]; then
            args+=("${extra_args[@]}")
          fi

          dotnet run -c Release --project benchmarks/AsyncResponse.LoadTests -- "${args[@]}"

      - name: Publish load-test throughput (bigger is better)
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          name: AsyncResponse Load test - throughput
          tool: customBiggerIsBetter
          output-file-path: loadtest.bigger.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: Publish load-test latency (smaller is better)
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          name: AsyncResponse Load test - latency
          tool: customSmallerIsBetter
          output-file-path: loadtest.smaller.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: Upload NBomber report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nbomber-report
          path: nbomber-report/**
