name: Load test

# End-to-end HTTP load test (NBomber) against the real Redis + broker transport stack. Runs the broad
# non-destructive profile on every push to main and publishes throughput/latency to the same gh-pages
# dashboard as the benchmarks workflow; manual runs can select focused pubsub/rabbitmq/recovery profiles. It is
# Docker-backed, so it shares a concurrency group with the benchmarks workflow to avoid racing on the
# gh-pages history.
on:
  push:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - '.github/workflows/loadtest.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Scenario profile: broad, pubsub, rabbitmq, redis, nats, postgresql, recovery'
        default: 'broad'
      rate:
        description: 'Requests per second, per scenario'
        default: '20'
      duration:
        description: 'Load duration in seconds'
        default: '30'
      redis_url:
        description: 'Optional existing Redis transport SUT URL for --redis-url'
        default: ''
      redis_early_ack_url:
        description: 'Optional existing Redis transport early-ACK SUT URL for --redis-early-ack-url'
        default: ''
      redis_worker_ack_mode:
        description: 'Redis worker ACK mode for Aspire SUT: AckAfterHandlerCompletes or AckAfterEnqueue'
        default: 'AckAfterEnqueue'
      redis_worker_background_workers:
        description: 'Redis early-ACK background worker count'
        default: '4'
      redis_worker_queue_capacity:
        description: 'Redis early-ACK background queue capacity'
        default: '256'
      redis_pending_idle_seconds:
        description: 'Redis pending-entry idle seconds before retry/claim'
        default: '1'
      redis_max_delivery_attempts:
        description: 'Redis max delivery attempts before dead-lettering'
        default: '5'
      redis_publish_max_attempts:
        description: 'Redis XADD publish retry attempts'
        default: '3'
      redis_stream_max_length:
        description: 'Redis worker/response stream MAXLEN setting'
        default: '100000'
      nats_url:
        description: 'Optional existing NATS SUT URL for --nats-url'
        default: ''
      nats_early_ack_url:
        description: 'Optional existing NATS early-ACK SUT URL for --nats-early-ack-url'
        default: ''
      nats_worker_ack_mode:
        description: 'NATS worker ACK mode for Aspire SUT: AckAfterHandlerCompletes or AckAfterReceive'
        default: 'AckAfterReceive'
      nats_worker_background_workers:
        description: 'NATS early-ACK background worker count'
        default: '4'
      nats_worker_queue_capacity:
        description: 'NATS early-ACK background queue capacity'
        default: '256'
      postgresql_url:
        description: 'Optional existing PostgreSQL SUT URL for --postgresql-url'
        default: ''
      postgresql_early_ack_url:
        description: 'Optional existing PostgreSQL early-ACK SUT URL for --postgresql-early-ack-url'
        default: ''
      postgresql_worker_ack_mode:
        description: 'PostgreSQL worker ACK mode for Aspire SUT: AckAfterHandlerCompletes or AckAfterReceive'
        default: 'AckAfterReceive'
      postgresql_worker_background_workers:
        description: 'PostgreSQL early-ACK background worker count'
        default: '4'
      postgresql_worker_queue_capacity:
        description: 'PostgreSQL early-ACK background queue capacity'
        default: '256'

# github-action-benchmark commits the results history to gh-pages.
permissions:
  contents: write

concurrency:
  group: benchmark-publish
  cancel-in-progress: false

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify Docker
        run: docker version

      # Boots Redis + a Pub/Sub emulator + RabbitMQ + sample SUTs via Aspire, drives them with NBomber, and
      # emits github-action-benchmark JSON. Exits non-zero (failing the job) if any request failed.
      - name: Run NBomber load test
        env:
          REDIS_URL: ${{ github.event.inputs.redis_url || '' }}
          REDIS_EARLY_ACK_URL: ${{ github.event.inputs.redis_early_ack_url || '' }}
          ASYNCRESPONSE_ITEST_REDIS_WORKER_ACK_MODE: ${{ github.event.inputs.redis_worker_ack_mode || 'AckAfterEnqueue' }}
          ASYNCRESPONSE_ITEST_REDIS_WORKER_BACKGROUND_WORKERS: ${{ github.event.inputs.redis_worker_background_workers || '4' }}
          ASYNCRESPONSE_ITEST_REDIS_WORKER_QUEUE_CAPACITY: ${{ github.event.inputs.redis_worker_queue_capacity || '256' }}
          ASYNCRESPONSE_ITEST_REDIS_PENDING_IDLE_SECONDS: ${{ github.event.inputs.redis_pending_idle_seconds || '1' }}
          ASYNCRESPONSE_ITEST_REDIS_MAX_DELIVERY_ATTEMPTS: ${{ github.event.inputs.redis_max_delivery_attempts || '5' }}
          ASYNCRESPONSE_ITEST_REDIS_PUBLISH_MAX_ATTEMPTS: ${{ github.event.inputs.redis_publish_max_attempts || '3' }}
          ASYNCRESPONSE_ITEST_REDIS_STREAM_MAX_LENGTH: ${{ github.event.inputs.redis_stream_max_length || '100000' }}
          NATS_URL: ${{ github.event.inputs.nats_url || '' }}
          NATS_EARLY_ACK_URL: ${{ github.event.inputs.nats_early_ack_url || '' }}
          ASYNCRESPONSE_ITEST_NATS_WORKER_ACK_MODE: ${{ github.event.inputs.nats_worker_ack_mode || 'AckAfterReceive' }}
          ASYNCRESPONSE_ITEST_NATS_WORKER_BACKGROUND_WORKERS: ${{ github.event.inputs.nats_worker_background_workers || '4' }}
          ASYNCRESPONSE_ITEST_NATS_WORKER_QUEUE_CAPACITY: ${{ github.event.inputs.nats_worker_queue_capacity || '256' }}
          POSTGRESQL_URL: ${{ github.event.inputs.postgresql_url || '' }}
          POSTGRESQL_EARLY_ACK_URL: ${{ github.event.inputs.postgresql_early_ack_url || '' }}
          ASYNCRESPONSE_ITEST_POSTGRESQL_WORKER_ACK_MODE: ${{ github.event.inputs.postgresql_worker_ack_mode || 'AckAfterReceive' }}
          ASYNCRESPONSE_ITEST_POSTGRESQL_WORKER_BACKGROUND_WORKERS: ${{ github.event.inputs.postgresql_worker_background_workers || '4' }}
          ASYNCRESPONSE_ITEST_POSTGRESQL_WORKER_QUEUE_CAPACITY: ${{ github.event.inputs.postgresql_worker_queue_capacity || '256' }}
        run: |
          args=(
            --profile "${{ github.event.inputs.profile || 'broad' }}"
            --rate "${{ github.event.inputs.rate || '20' }}"
            --duration "${{ github.event.inputs.duration || '30' }}"
            --warmup 10
            --gh-json "${{ github.workspace }}/loadtest"
          )
          if [ -n "$REDIS_URL" ]; then
            args+=(--redis-url "$REDIS_URL")
          fi
          if [ -n "$REDIS_EARLY_ACK_URL" ]; then
            args+=(--redis-early-ack-url "$REDIS_EARLY_ACK_URL")
          fi
          if [ -n "$NATS_URL" ]; then
            args+=(--nats-url "$NATS_URL")
          fi
          if [ -n "$NATS_EARLY_ACK_URL" ]; then
            args+=(--nats-early-ack-url "$NATS_EARLY_ACK_URL")
          fi
          if [ -n "$POSTGRESQL_URL" ]; then
            args+=(--postgresql-url "$POSTGRESQL_URL")
          fi
          if [ -n "$POSTGRESQL_EARLY_ACK_URL" ]; then
            args+=(--postgresql-early-ack-url "$POSTGRESQL_EARLY_ACK_URL")
          fi
          dotnet run -c Release --project benchmarks/AsyncResponse.LoadTests -- "${args[@]}"

      - name: Publish load-test throughput (bigger is better)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: AsyncResponse Load test - throughput
          tool: customBiggerIsBetter
          output-file-path: loadtest.bigger.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: Publish load-test latency (smaller is better)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: AsyncResponse Load test - latency
          tool: customSmallerIsBetter
          output-file-path: loadtest.smaller.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: Upload NBomber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbomber-report
          path: nbomber-report/**
