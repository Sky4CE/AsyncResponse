# Publishes the NuGet packages to nuget.org.
#
# Trigger: publish a GitHub Release (or push a tag) named like `v1.2.3`.
# The version is derived from the tag, overriding the <Version> in Directory.Build.props.
#
# Required repository secret: NUGET_API_KEY — create it at
# https://www.nuget.org/account/apikeys (scope: Push, glob: AsyncResponse.*).
name: Publish NuGet

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

# Publishing a release for tag vX.Y.Z also pushes the tag, so both triggers can fire for the same
# version; serialize runs per ref (no cancellation) so two publishes never run concurrently.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ancestry check below needs history, not just the tagged commit.
          fetch-depth: 0

      # A tag can be pushed to ANY commit, including one that never went through a pull request.
      # Without this, tag-creation rights alone were enough to publish unreviewed code to nuget.org
      # under the repository's push key — around branch protection, not through it. Publishing only
      # what `main` already contains puts the review gate back in front of the package.
      - name: Verify the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Commit $(git rev-parse HEAD) is not reachable from origin/main; publish only tags on main."
            exit 1
          fi
          echo "Tagged commit is an ancestor of origin/main."

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Strict SemVer 2.0 shape: prerelease and build-metadata identifiers are limited to
      # [0-9A-Za-z.-]. The ancestry check above exists so that tag-push rights alone cannot decide
      # what gets published; a looser pattern (anything after the first '-') left the tag NAME as a
      # build input — MSBuild splits -p: on ';', so v1.0.0-a;Version=2.0.0 published 2.0.0.
      - name: Derive package version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not look like a semantic version tag (expected e.g. v1.2.3 or v1.2.3-preview.1)."
            exit 1
          fi
          echo "PACKAGE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "Publishing version ${TAG#v}"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version="$PACKAGE_VERSION"

      # Unit suite only, one TFM at a time — same invocation shape as ci.yml (MTP otherwise runs
      # both TFMs concurrently, which starves real-time tests on the 2-core hosted runner).
      # The Docker/Aspire integration suite is omitted here because it already gates every merge to main.
      # No coverage collection: nothing consumed the output here, and an instrumented run gates on
      # rewritten IL rather than on what ships (see scripts/coverage-collect.sh); this job is a
      # release gate, not a coverage source.
      - name: Test (unit, net8.0)
        run: |
          dotnet test --project tests/AsyncResponse.Tests/AsyncResponse.Tests.csproj \
            --configuration Release --framework net8.0 --no-build \
            --report-trx \
            --results-directory "${{ github.workspace }}/TestResults"

      - name: Test (unit, net10.0)
        run: |
          dotnet test --project tests/AsyncResponse.Tests/AsyncResponse.Tests.csproj \
            --configuration Release --framework net10.0 --no-build \
            --report-trx \
            --results-directory "${{ github.workspace }}/TestResults"

      - name: Pack
        # Solution-level pack: every non-src project sets IsPackable=false, so this packs exactly
        # the shipped src/** packages without a hand-maintained list.
        run: dotnet pack AsyncResponse.slnx --configuration Release --no-build -p:Version="$PACKAGE_VERSION" -o ./artifacts

      - name: Push to nuget.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
