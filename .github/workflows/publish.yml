# Publishes the NuGet packages to nuget.org.
#
# Trigger: publish a GitHub Release (or push a tag) named like `v1.2.3`.
# The version is derived from the tag, overriding the <Version> in Directory.Build.props.
#
# Required repository secret: NUGET_API_KEY — create it at
# https://www.nuget.org/account/apikeys (scope: Push, glob: AsyncResponse.*).
name: Publish NuGet

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Derive package version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+].*)?$ ]]; then
            echo "::error::Tag '$TAG' does not look like a semantic version tag (expected e.g. v1.2.3 or v1.2.3-preview.1)."
            exit 1
          fi
          echo "PACKAGE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "Publishing version ${TAG#v}"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=$PACKAGE_VERSION

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack src/AsyncResponse.Abstractions/AsyncResponse.Abstractions.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/AsyncResponse.Core/AsyncResponse.Core.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/Channels/AsyncResponse.Channels.MongoDB/AsyncResponse.Channels.MongoDB.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/Channels/AsyncResponse.Channels.NATS/AsyncResponse.Channels.NATS.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/Channels/AsyncResponse.Channels.PostgreSQL/AsyncResponse.Channels.PostgreSQL.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/Channels/AsyncResponse.Channels.Redis/AsyncResponse.Channels.Redis.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/Channels/AsyncResponse.Channels.SqlServer/AsyncResponse.Channels.SqlServer.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.AzureServiceBus/AsyncResponse.Transports.AzureServiceBus.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.Kafka/AsyncResponse.Transports.Kafka.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.MongoDB/AsyncResponse.Transports.MongoDB.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.NATS/AsyncResponse.Transports.NATS.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.PostgreSQL/AsyncResponse.Transports.PostgreSQL.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.RabbitMQ/AsyncResponse.Transports.RabbitMQ.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.Redis/AsyncResponse.Transports.Redis.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.SqlServer/AsyncResponse.Transports.SqlServer.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.GooglePubSub/AsyncResponse.Transports.GooglePubSub.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/Transports/AsyncResponse.Transports.SQS/AsyncResponse.Transports.SQS.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.SqlServer/AsyncResponse.DurableFlows.SqlServer.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.PostgreSQL/AsyncResponse.DurableFlows.PostgreSQL.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.MySql/AsyncResponse.DurableFlows.MySql.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.Sqlite/AsyncResponse.DurableFlows.Sqlite.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.Oracle/AsyncResponse.DurableFlows.Oracle.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.MongoDB/AsyncResponse.DurableFlows.MongoDB.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.Cosmos/AsyncResponse.DurableFlows.Cosmos.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.DynamoDB/AsyncResponse.DurableFlows.DynamoDB.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts
          dotnet pack src/DurableFlows/AsyncResponse.DurableFlows.EFCore/AsyncResponse.DurableFlows.EFCore.csproj --configuration Release --no-build -p:Version=$PACKAGE_VERSION -o ./artifacts

      - name: Push to nuget.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
