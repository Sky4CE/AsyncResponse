# Publishes the NuGet packages to nuget.org.
#
# Trigger: publish a GitHub Release (or push a tag) named like `v1.2.3`.
# The version is derived from the tag, overriding the <Version> in Directory.Build.props.
#
# Required repository secret: NUGET_API_KEY — create it at
# https://www.nuget.org/account/apikeys (scope: Push, glob: AsyncResponse.*).
name: Publish NuGet

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

# Publishing a release for tag vX.Y.Z also pushes the tag, so both triggers can fire for the same
# version; serialize runs per ref (no cancellation) so two publishes never run concurrently.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Up to 45 minutes waiting for the commit's CI run (see "Require a green CI run" below) plus
    # the build, the two unit legs and the push.
    timeout-minutes: 90
    permissions:
      contents: read
      # Reads the commit's CI run (scripts/require-ci-success.sh); nothing here writes to Actions.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ancestry check below needs history, not just the tagged commit.
          fetch-depth: 0

      # A tag can be pushed to ANY commit, including one that never went through a pull request.
      # Without this, tag-creation rights alone were enough to publish unreviewed code to nuget.org
      # under the repository's push key. Publishing only what `main` already contains keeps a
      # side-branch commit off the feed — but `main` itself takes direct pushes and is not a
      # gate: being on main proves only that a commit is there, not that anything tested it. The
      # next step is what proves that.
      - name: Verify the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Commit $(git rev-parse HEAD) is not reachable from origin/main; publish only tags on main."
            exit 1
          fi
          echo "Tagged commit is an ancestor of origin/main."

      # CI runs AFTER a commit lands on main, so without this a tag on a commit whose integration
      # batches, matrix shards, Native AOT legs or cross-platform units failed — or had not
      # finished yet — was published on the strength of the unit suite below alone. The gate
      # requires the commit's latest ci.yml run from a push to main to have concluded `success`
      # (so a run auto-retry.yml re-ran green counts, and one still re-running is waited for). A
      # run still in progress is waited for up to 45 minutes (a CI run takes 20–25); a failed,
      # cancelled — e.g. superseded in CI's concurrency queue — or missing run, or an API error,
      # fails the job, and re-running it once CI is green is enough. Logic and fixtures:
      # scripts/require-ci-success.sh, scripts/tests/require-ci-success.test.sh.
      - name: Require a green CI run of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_WAIT_SECONDS: "2700"
          CI_POLL_SECONDS: "60"
        run: COMMIT_SHA="$(git rev-parse HEAD)" bash scripts/require-ci-success.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Strict SemVer 2.0 shape: prerelease and build-metadata identifiers are limited to
      # [0-9A-Za-z.-]. The ancestry check above exists so that tag-push rights alone cannot decide
      # what gets published; a looser pattern (anything after the first '-') left the tag NAME as a
      # build input — MSBuild splits -p: on ';', so v1.0.0-a;Version=2.0.0 published 2.0.0.
      - name: Derive package version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not look like a semantic version tag (expected e.g. v1.2.3 or v1.2.3-preview.1)."
            exit 1
          fi
          echo "PACKAGE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "Publishing version ${TAG#v}"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version="$PACKAGE_VERSION"

      # Unit suite only, one TFM at a time — same invocation shape as ci.yml (MTP otherwise runs
      # both TFMs concurrently, which starves real-time tests on the 2-core hosted runner).
      # The Docker/Aspire integration suite is not re-run here: the "Require a green CI run" step
      # above already demands that ci.yml — integration batches, matrix shards and AOT legs
      # included — passed for this exact commit. These legs re-test the Release build being packed.
      # No coverage collection: nothing consumed the output here, and an instrumented run gates on
      # rewritten IL rather than on what ships (see scripts/coverage-collect.sh); this job is a
      # release gate, not a coverage source.
      - name: Test (unit, net8.0)
        run: |
          dotnet test --project tests/AsyncResponse.Tests/AsyncResponse.Tests.csproj \
            --configuration Release --framework net8.0 --no-build \
            --report-trx \
            --results-directory "${{ github.workspace }}/TestResults"

      - name: Test (unit, net10.0)
        run: |
          dotnet test --project tests/AsyncResponse.Tests/AsyncResponse.Tests.csproj \
            --configuration Release --framework net10.0 --no-build \
            --report-trx \
            --results-directory "${{ github.workspace }}/TestResults"

      - name: Pack
        # Solution-level pack: every non-src project sets IsPackable=false, so this packs exactly
        # the shipped src/** packages without a hand-maintained list.
        run: dotnet pack AsyncResponse.slnx --configuration Release --no-build -p:Version="$PACKAGE_VERSION" -o ./artifacts

      - name: Verify sibling package dependencies are pinned
        # The packages share internals, so a mixed-version install fails at runtime rather than at
        # restore. src/Directory.Build.targets pins each sibling dependency to an exact version
        # through a private NuGet pack target; this is the check from outside it (ci.yml runs it
        # on every push too, so a broken pin is seen long before a release).
        run: bash scripts/verify-package-dependencies.sh ./artifacts

      - name: Push to nuget.org
        # Dependency order: a consumer that restores a provider package the moment it appears must
        # find the Abstractions/Core it pins already on the feed. A mid-push failure then leaves a
        # resolvable graph instead of satellites whose exact-pinned Core does not exist yet.
        # --skip-duplicate makes a re-run of this job idempotent.
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          push() {
            dotnet nuget push "$1" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          }

          push "./artifacts/AsyncResponse.Abstractions.*.nupkg"
          push "./artifacts/AsyncResponse.Core.*.nupkg"
          for package in ./artifacts/*.nupkg; do
            case "$(basename "$package")" in
              AsyncResponse.Abstractions.*|AsyncResponse.Core.*) continue ;;
            esac
            push "$package"
          done
