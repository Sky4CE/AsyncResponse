name: Auto-retry failed jobs

# Hosted runners are flaky and this repo runs 24 job legs per push to main. When a run on main
# fails, re-run only its failed jobs (and their dependents) — the same button as "Re-run failed
# jobs" in the UI, pressed automatically. The FIRST re-run is unconditional. Later re-runs need a
# failed job's log to match a known infrastructure signature: an unconditional five-attempt loop
# gave an intermittently failing product bug — a race, a lease, a watchdog — five chances to land
# green on main, and publish.yml relies on main's check as the reviewed gate. The run_attempt
# guard is what stops this recursing: each re-run fires `workflow_run: completed` again when it
# finishes.
on:
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    # Attempt 1 fails -> retry as attempt 2 ... attempt 5 fails -> stop. Five attempts total.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt < 5
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          # ci.yml's own in-job retry gates on the same fixture-boot flake. "database is locked"
          # is SQLite on a slow runner disk during the EF Core storm tests (see the tests' own
          # comments); the last two are hosted-runner infrastructure loss.
          FLAKE_SIGNATURES: >-
            Fixture' threw in InitializeAsync|SQLite Error 5: 'database is locked'|lost communication with the server|The runner has received a shutdown signal
        run: |
          set -euo pipefail
          failed_jobs=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.id) \(.name)"')
          echo "Failed jobs of $WORKFLOW run $RUN_ID (attempt $ATTEMPT):"; echo "${failed_jobs:-<none listed>}"

          if [ "$ATTEMPT" -lt 2 ]; then
            echo "::notice::Re-running failed jobs of $WORKFLOW run $RUN_ID (attempt $ATTEMPT of 5): the first re-run is unconditional."
            gh api --method POST "repos/$GH_REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
            exit 0
          fi

          # From the second re-run on, a failed job's log must match a known flake signature.
          matched=""
          fetched=0
          while read -r job_id job_name; do
            [ -n "$job_id" ] || continue
            # curl, not `gh api`: the test runner's log is full of ANSI colour codes, and the
            # runner's gh refuses to output such a response ("pass --allow-escape-sequences") —
            # a flag other gh versions do not even have. That refusal is also what emptied the
            # earlier whole-run `gh run view --log-failed`. The endpoint answers with a redirect
            # to a signed URL; curl follows it and drops the token on the cross-host hop.
            if ! curl -fsSL \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 -H "X-GitHub-Api-Version: 2022-11-28" \
                 "https://api.github.com/repos/$GH_REPO/actions/jobs/$job_id/logs" > "job-$job_id.log" 2> "job-$job_id.err"; then
              echo "::warning::Could not fetch the log of job $job_id ($job_name): $(tr '\n' ' ' < "job-$job_id.err")"
              continue
            fi
            fetched=$((fetched + 1))
            if grep -Eq "$FLAKE_SIGNATURES" "job-$job_id.log"; then
              matched="$job_id ($job_name)"
              break
            fi
          done <<< "$failed_jobs"

          if [ -z "$matched" ]; then
            if [ "$fetched" -eq 0 ]; then
              echo "::warning::Not re-running $WORKFLOW run $RUN_ID (attempt $ATTEMPT): could not read any failed job log, so the gate cannot tell a flake from a bug. Fix the log fetch above."
            else
              echo "::warning::Not re-running $WORKFLOW run $RUN_ID (attempt $ATTEMPT): no failed job's log matches a known flake signature; a failure that survives one re-run is treated as real."
            fi
            exit 0
          fi
          echo "::notice::Re-running failed jobs of $WORKFLOW run $RUN_ID (attempt $ATTEMPT of 5): job $matched matched a known flake signature."
          gh api --method POST "repos/$GH_REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
