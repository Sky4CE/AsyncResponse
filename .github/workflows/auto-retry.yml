name: Auto-retry failed jobs

# Hosted runners are flaky and this repo runs 24 job legs per push to main. When a run on main
# fails, re-run only its failed jobs (and their dependents) — the same button as "Re-run failed
# jobs" in the UI, pressed automatically. The run_attempt guard is what stops this recursing:
# each re-run fires `workflow_run: completed` again when it finishes.
on:
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    # Attempt 1 fails -> retry as attempt 2 ... attempt 5 fails -> stop. Five attempts total.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt < 5
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          # Retry only on a known infrastructure signature (ci.yml's own retry step gates on the
          # same fixture-boot flake). An unconditional re-run gave an intermittently failing
          # product bug — a race, a lease, a watchdog — five chances to land green on main, and
          # publish.yml relies on main's check as the reviewed gate.
          if ! gh run view "$RUN_ID" --log-failed 2>/dev/null \
               | grep -Eq "Fixture' threw in InitializeAsync|lost communication with the server|The runner has received a shutdown signal"; then
            echo "::warning::Not re-running ${{ github.event.workflow_run.name }} run $RUN_ID (attempt $ATTEMPT): the failure does not match a known flake signature."
            exit 0
          fi
          echo "::notice::Re-running failed jobs of ${{ github.event.workflow_run.name }} run $RUN_ID (attempt $ATTEMPT of 5)"
          gh api --method POST "repos/$GH_REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
