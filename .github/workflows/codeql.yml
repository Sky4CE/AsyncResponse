name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # Weekly re-scan: picks up newly released CodeQL queries even when the code has not changed.
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # CodeQL uploads its findings to the repository's code-scanning view.
      security-events: write
      # The analyzer reads workflow-run metadata; explicit job permissions otherwise zero this scope.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: csharp
          build-mode: manual

      - name: Build
        # Build only the shipped packages: analysis on the src closure, not tests/benchmarks.
        run: |
          dotnet restore
          dotnet build src/AsyncResponse.Core/AsyncResponse.Core.csproj --configuration Release --no-restore
          dotnet build src/AsyncResponse.Testing/AsyncResponse.Testing.csproj --configuration Release --no-restore
          for proj in src/Channels/*/*.csproj src/Transports/*/*.csproj src/DurableFlows/AsyncResponse.*/*.csproj; do
            dotnet build "$proj" --configuration Release --no-restore
          done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:csharp"
