# Local Redis for running the sample and experimenting with the library:
#   docker compose up -d
#
# Bound to loopback on purpose. Docker publishes an unqualified port on every host interface, and
# the official image runs with protected mode off, so "6379:6379" exposed an unauthenticated Redis
# to the whole network segment — and AsyncResponse trusts what that Redis holds (recovery
# descriptors, response envelopes). Anything that must be reachable from another machine needs
# `requirepass`/ACLs and network isolation, not a wider bind (docs/security.md).
services:
  redis:
    # Pinned by multi-arch index digest (tag kept for readability), like the integration AppHost.
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    ports:
      - "127.0.0.1:6379:6379"
